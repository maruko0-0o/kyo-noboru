    <button class="primary" type="submit">加入日历</button>

<section id="body" class="hidden">
  <section class="card">
    <div class="label">現在のID / 我是谁</div>
    <div id="identityList" class="row"></div>
    <button id="manageBtn" class="textbtn" type="button">好友管理</button>
  </section>

  <section id="friendManager" class="card hidden">
    <div class="friendhead"><strong>好友管理</strong><button id="closeManager" class="textbtn" type="button">完成</button></div>
    <div id="friendRows"></div>
    <button id="addFriend" class="secondary" type="button">＋ 添加岩友</button>

      <button data-mode="year" type="button">年</button>

    <div class="calhead">
      <button id="prev" class="square" type="button">‹</button>
      <div id="calTitle" class="caltitle"></div>
      <div class="headtools"><button id="today" class="square" type="button">今</button><button id="next" class="square" type="button">›</button></div>

    <div id="calendarBody"></div>
    <section id="detail" class="card detail"></section>
  </section>

      <button data-range="all" type="button">全部</button>

    <div id="sessionList"></div>

    </form>
  </section>
</section>

function renderWeek(){const a=monday(state.cursor),days=Array.from({length:7},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return d});const peopleFor=sessions=>[...new Map(sessions.flatMap(s=>s.participants.map(p=>[p.member_id,member(p.member_id)])).filter(([,u])=>u)).values()];$("calendarBody").innerHTML=`<div class="calbox"><div class="weekgrid">${days.map(d=>{const ds=iso(d),groups={};sessionsOn(ds).forEach(s=>(groups[s.gym_id||"none"]??=[]).push(s));return`<div class="weekcol"><div class="weekday">${["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()]}</div><div class="weeknum">${d.getDate()}</div>${Object.entries(groups).map(([gymId,sessions])=>{const g=gym(gymId),groupPeople=peopleFor(sessions),slots={};sessions.forEach(s=>(slots[s.start_time]??=[]).push(s));return`<article class="weekgymcard"><div class="weekgymhead"><span class="weekgymtag">${esc(g?.name||"未指定")}</span><span class="weekgymcount">${groupPeople.length}人</span></div>${Object.entries(slots).map(([time,slotSessions])=>{const people=peopleFor(slotSessions),types=[...new Set(slotSessions.map(s=>s.climb_type))];return`<div class="weekslot"><span class="weektime">${String(time).slice(0,5)}</span><div><div class="weektype">${esc(types.join(" / "))}</div><div class="weekpeople">${people.map(u=>`<span class="weekperson"><i style="background:${u.color}"></i>${esc(u.display_name)}</span>`).join("")||"<span class=\"weekperson\">暂无参加者</span>"}</div></div></div>`}).join("")}</article>`}).join("")}</div>`}).join("")}</div></div>`}
function renderYear(){const y=state.cursor.getFullYear();const mini=m=>{const f=new Date(y,m,1),off=(f.getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h="";for(let i=0;i<off;i++)h+="<span></span>";for(let d=1;d<=n;d++){const ids=peopleOn(iso(new Date(y,m,d)));h+=`<span class="miniday">${ids.slice(0,4).map(id=>{const u=member(id);return u?`<i style="background:${u.color}"></i>`:""}).join("")}</span>`}return h};$("calendarBody").innerHTML=`<div class="calbox"><div class="yeargrid">${Array.from({length:12},(_,m)=>`<div class="minimonth"><div class="minititle">${m+1}月</div><div class="minigrid">${mini(m)}</div></div>`).join("")}</div></div>`}

function renderSessions(){const a=monday(new Date()),b=new Date(a),c=new Date(a);b.setDate(a.getDate()+7);c.setDate(a.getDate()+14);const list=state.sessions.filter(s=>{const d=parse(s.climb_date);return state.range==="all"||state.range==="week"&&d>=a&&d<b||state.range==="next"&&d>=b&&d<c});$("sessionList").innerHTML=list.length?list.map(s=>{const g=gym(s.gym_id),joined=s.participants.some(p=>p.member_id===state.currentMemberId),creator=s.creator_member_id===state.currentMemberId;return`<article class="session"><div class="sessiondate">${fmt(s.climb_date)} · ${String(s.start_time).slice(0,5)}</div><div class="place">${esc(g?.name||"未指定")}</div><div class="meta"><span class="metatag">${esc(g?.name||"未指定")}</span><span>${esc(s.climb_type)}</span><span>👥 ${s.participants.length}人</span>${s.note?`<span>${esc(s.note)}</span>`:""}</div>${s.participants.map(p=>{const u=member(p.member_id);return u?`<div class="person"><div class="face" style="background:${u.color}">${esc(initials(u.display_name))}</div><div><div class="pname">${esc(u.display_name)}</div><div class="hp"><i style="width:${p.hp}%;background:${u.color}"></i></div></div><div class="hpnum">${p.hp}%</div></div>`:""}).join("")}<div class="sessionactions">${!creator?`<button class="join ${joined?"joined":""}" data-join="${s.id}" type="button">${joined?"✓ 已参加 · 点击取消":"＋ 我也去"}</button>`:""}${creator?`<button class="secondaryaction" data-edit="${s.id}" type="button">编辑行程</button><button class="dangeraction" data-cancel="${s.id}" type="button">取消行程</button>`:""}</div></article>`}).join(""):`<div class="card hint">这个时间段还没有行程。</div>`;document.querySelectorAll("[data-join]").forEach(b=>b.addEventListener("click",()=>joinSession(b.dataset.join)));document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openEditSession(b.dataset.edit)));document.querySelectorAll("[data-cancel]").forEach(b=>b.addEventListener("click",()=>cancelSession(b.dataset.cancel)))}
async function joinSession(id){if(!state.currentMemberId)return alert("请先选择你的 ID");const s=state.sessions.find(x=>x.id===id);if(s?.participants.some(p=>p.member_id===state.currentMemberId))return leaveSession(id);const{error}=await db.from("climb_participants").insert({session_id:id,member_id:state.currentMemberId,hp:80,participation_status:"going"});if(error)return alert(error.message);await refresh()}

async function deleteGym(id){const g=gym(id);if(state.sessions.some(s=>s.gym_id===id))return alert(`「${g?.name||"这个攀岩馆"}」已有历史行程，为保留记录不能删除。`);if(!confirm(`删除「${g?.name||"这个攀岩馆"}」？`))return;const{error}=await db.from("climb_gyms").delete().eq("id",id).eq("group_id",state.groupId);if(error)return alert(`删除失败：${error.message}`);if(state.selectedGymId===id)state.selectedGymId=state.gyms.find(x=>x.id!==id)?.id||null;await refresh(false)}
function enableGymSorting(){const picker=$("gymTags");let dragging=null,changed=false;const clear=()=>picker.querySelectorAll(".dragging,.drop-target").forEach(x=>x.classList.remove("dragging","drop-target"));const persist=async()=>{const order=[...picker.querySelectorAll("[data-gym-tag]")].map(x=>x.dataset.gymTag);if(order.every((id,i)=>id===state.gyms[i]?.id))return;const byId=new Map(state.gyms.map(g=>[g.id,g]));state.gyms=order.map((id,i)=>({...byId.get(id),sort_order:i+1}));const results=await Promise.all(state.gyms.map(g=>db.from("climb_gyms").update({sort_order:g.sort_order}).eq("id",g.id).eq("group_id",state.groupId)));const failure=results.find(r=>r.error);if(failure){alert(`保存 Tag 顺序失败：${failure.error.message}`);await refresh(false);return}renderGyms()};picker.querySelectorAll(".gymtag-handle").forEach(handle=>handle.addEventListener("pointerdown",e=>{dragging=handle.closest("[data-gym-tag]");changed=false;dragging.classList.add("dragging");handle.setPointerCapture(e.pointerId);e.preventDefault()}));picker.querySelectorAll(".gymtag-handle").forEach(handle=>handle.addEventListener("pointermove",e=>{if(!dragging)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-gym-tag]");picker.querySelectorAll(".drop-target").forEach(x=>x.classList.remove("drop-target"));if(!target||target===dragging||!picker.contains(target))return;target.classList.add("drop-target");const box=target.getBoundingClientRect(),after=e.clientX>box.left+box.width/2||e.clientY>box.top+box.height/2;picker.insertBefore(dragging,after?target.nextSibling:target);changed=true}));picker.querySelectorAll(".gymtag-handle").forEach(handle=>handle.addEventListener("pointerup",async()=>{if(!dragging)return;clear();dragging=null;if(changed)await persist()}));picker.querySelectorAll(".gymtag-handle").forEach(handle=>handle.addEventListener("pointercancel",()=>{if(!dragging)return;clear();dragging=null;renderGyms()}))}

async function createSession(e){e.preventDefault();if(!state.currentMemberId)return alert("请先选择你的 ID");if(!state.selectedGymId)return alert("请选择攀岩馆 Tag");const payload={gym_id:state.selectedGymId,climb_date:$("dateInput").value,start_time:$("timeInput").value,climb_type:$("typeInput").value,note:$("noteInput").value.trim()||null};if(state.editingSessionId){const{error}=await db.from("climb_sessions").update(payload).eq("id",state.editingSessionId).eq("group_id",state.groupId);if(error)return alert(`保存失败：${error.message}`);state.selectedDate=payload.climb_date;$("newPanel").classList.add("hidden");resetSessionForm();await refresh();return}const{data,error}=await db.from("climb_sessions").insert({...payload,group_id:state.groupId,creator_member_id:state.currentMemberId}).select().single();if(error)return alert(error.message);const{error:pe}=await db.from("climb_participants").insert({session_id:data.id,member_id:state.currentMemberId,hp:Number($("hpInput").value),participation_status:"going"});if(pe)return alert(pe.message);state.selectedDate=payload.climb_date;$("newPanel").classList.add("hidden");resetSessionForm();await refresh()}

 let installPrompt=null;const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isStandalone)$("installBtn").classList.add("hidden");window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e});$("installBtn").addEventListener("click",async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}if(isIos)return alert("请用 Safari 打开本页，点底部的分享按钮，再选择「添加到主屏幕」。");alert("请用手机浏览器打开本页，并在浏览器菜单中选择「安装应用」或「添加到主屏幕」。")});window.addEventListener("appinstalled",()=>$("installBtn").classList.add("hidden"));
 window.addEventListener("focus",()=>refresh(false).catch(()=>{}));setInterval(()=>refresh(false).catch(()=>{}),30000)
}
async function init(){try{setStatus("正在连接共享日历…");await ensureAuth();await joinGroup();await loadAll();subscribeRealtime();bind();renderAll();$("body").classList.remove("hidden");hideStatus()}catch(e){console.error(e);const message=e.message||String(e);if(!state.groupCode&&message.includes("首次使用")){$("joinPanel").classList.remove("hidden");setStatus("首次打开请选择或粘贴一条邀请链接。加入后会自动记住。",false);return}setStatus(`连接失败：${message}`,true)}}
init();
function inviteCode(value){const raw=value.trim();try{return new URL(raw).searchParams.get("g")||""}catch(e){return raw}}
$("joinForm").addEventListener("submit",e=>{e.preventDefault();const code=inviteCode($("inviteInput").value);if(!code)return alert("请粘贴包含邀请码的邀请链接，或直接输入邀请码。");const url=new URL(location.href);url.searchParams.set("g",code);location.assign(url)});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").then(reg=>reg.update()).catch(e=>console.warn("Service worker 注册失败",e)));
